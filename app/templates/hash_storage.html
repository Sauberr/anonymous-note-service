<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("Result") }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<main class="container">
    <section class="card center-card">
        <div class="status-icon ok">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>{{ _("Note created") }}</h2>
        <p class="hint">{{ _("Share this ID together with your secret phrase. Keep both safe.") }}</p>

        <div class="id-block">
            <div>
                <div class="id-label">{{ _("ID note:") }}</div>
                <p class="id-value" id="noteId">{{ note_id }}</p>
            </div>
            <button class="copy-btn" onclick="copyId()" title="{{ _('Copy') }}">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
        </div>
        <p class="copied-msg" id="copied">{{ _("Copied!") }}</p>

        <button class="btn btn-secondary mt" onclick="returnToRoot()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            {{ _("Return") }}
        </button>
    </section>
</main>

<script src="{{ url_for('static', path='js/pages.js') }}"></script>
</body>
</html>
