<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("Account") }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/api/v1/notes/" style="text-decoration:none;color:inherit">
        <span class="mark">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </span>
        {{ _("Anonymous Notes") }}
    </a>
    <nav class="lang">
        <a href="#" onclick="setLanguage('en')" class="{{ 'active' if locale == 'en' else '' }}">EN</a>
        <a href="#" onclick="setLanguage('ru')" class="{{ 'active' if locale == 'ru' else '' }}">RU</a>
    </nav>
</header>

<main class="container">
    <section class="card auth-wrap">
        <div class="auth-tabs">
            <button type="button" id="tabLogin" class="active" onclick="showMode('login')">{{ _("Sign in") }}</button>
            <button type="button" id="tabRegister" onclick="showMode('register')">{{ _("Sign up") }}</button>
        </div>

        <div class="alert" id="alert"></div>

        <!-- Login -->
        <form class="auth-form active" id="loginForm" data-mode="login">
            <div class="field">
                <label for="loginEmail">{{ _("Email") }}</label>
                <input type="text" id="loginEmail" name="email" placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="loginPassword">{{ _("Password") }}</label>
                <input type="text" id="loginPassword" name="password" placeholder="••••••••" style="-webkit-text-security:disc;text-security:disc">
            </div>
            <button class="btn btn-primary" type="submit">{{ _("Sign in") }}</button>
            <div class="link-row"><a onclick="showMode('forgot')">{{ _("Forgot password?") }}</a></div>
        </form>

        <!-- Register -->
        <form class="auth-form" id="registerForm" data-mode="register">
            <div class="field">
                <label for="regEmail">{{ _("Email") }}</label>
                <input type="text" id="regEmail" name="email" placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="regPassword">{{ _("Password") }}</label>
                <input type="text" id="regPassword" name="password" placeholder="••••••••" style="-webkit-text-security:disc;text-security:disc">
            </div>
            <button class="btn btn-primary" type="submit">{{ _("Create account") }}</button>
            <div class="link-row">{{ _("Already have an account?") }} <a onclick="showMode('login')">{{ _("Sign in") }}</a></div>
        </form>

        <!-- Forgot -->
        <form class="auth-form" id="forgotForm" data-mode="forgot">
            <div class="field">
                <label for="forgotEmail">{{ _("Email") }}</label>
                <input type="text" id="forgotEmail" name="email" placeholder="you@example.com">
            </div>
            <button class="btn btn-primary" type="submit">{{ _("Send reset link") }}</button>
            <div class="link-row"><a onclick="showMode('login')">{{ _("Back to sign in") }}</a></div>
        </form>

        <div class="auth-sep">{{ _("or") }}</div>

        <button class="btn btn-google" type="button" onclick="loginWithGoogle()">
            <span class="g">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.2-2.2H12v4.1h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.6z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 12 0 12 12 0 0 0 1.3 6.6l4 3.1C6.2 6.9 8.9 4.8 12 4.8z"/></svg>
            </span>
            {{ _("Continue with Google") }}
        </button>

        <div class="link-row" style="margin-top:18px"><a href="/api/v1/notes/">← {{ _("Back to notes") }}</a></div>
    </section>
</main>

<script>
    window.APP_I18N = {
        loginOk: "{{ _('Signed in successfully.') }}",
        registerOk: "{{ _('Account created. You can sign in now.') }}",
        forgotOk: "{{ _('If that email exists, a reset link has been sent.') }}",
        loginFail: "{{ _('Invalid email or password.') }}",
        registerFail: "{{ _('Registration failed. The email may already be in use.') }}",
        needFields: "{{ _('Please fill in all fields.') }}",
        googleFail: "{{ _('Could not start Google sign-in.') }}"
    };
</script>
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
</body>
</html>
